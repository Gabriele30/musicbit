name: musicbit
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      MUSICBIT_DB_PATH: /data/musicbit.sqlite
      AUTH_REGISTRATION: ${AUTH_REGISTRATION:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      MUSICBIT_REQUIRE_ACCOUNT: ${MUSICBIT_REQUIRE_ACCOUNT:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PLAYLIST_MODEL: ${OPENAI_PLAYLIST_MODEL:-gpt-4o-mini}
      YOUTUBE_CATALOG_ENABLED: ${YOUTUBE_CATALOG_ENABLED:-true}
      CATALOG_TTL_MS: ${CATALOG_TTL_MS:-300000}
      CATALOG_TIMEOUT_MS: ${CATALOG_TIMEOUT_MS:-10000}
    volumes:
      - musicbit_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  musicbit_data:
