# Access logs exclude query strings, headers and client addresses.
log_format musicbit '[$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log musicbit;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 'ok'; }
    location = /health { proxy_pass http://api:3001; }
    # Recovery must bypass navigation fallbacks in previously installed workers.
    location = /api/app-update {
        default_type text/html;
        add_header Cache-Control 'no-store';
        alias /usr/share/nginx/html/app-update.html;
    }
    location = /api/app-update.js {
        add_header Cache-Control 'no-store';
        alias /usr/share/nginx/html/app-update.js;
    }
    location /api/ {
        # Nginx error messages may embed the original URI, including search text.
        # Keep status in sanitized access logs; Fastify logs safe error codes.
        error_log /dev/null crit;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
    }
    location = /sw.js {
        add_header Cache-Control 'no-cache';
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control 'no-cache';
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
